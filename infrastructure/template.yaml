AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 512
    Timeout: 300
    Environment:
      Variables:
        BEDROCK_REGION: eu-west-2
        REQUIRE_PAYMENT: 'false'
        ALLOWED_ORIGIN: 'https://compliance.ishsitotombe.co.uk'
        # Additional origins handled in code (corsHeaders function)

Resources:
  ComplianceAuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: lambda/handler.handler
      Policies:
        - AmazonBedrockFullAccess
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  AuditFunctionUrl:
    Description: 'Lambda Function URL (no 30s API Gateway timeout)'
    Value: !GetAtt ComplianceAuditFunctionUrl.FunctionUrl
