AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 512
    Timeout: 300
    Environment:
      Variables:
        REQUIRE_PAYMENT: 'false'
        BEDROCK_REGION: 'eu-west-2'
        ALLOWED_ORIGIN: 'https://compliance.ishsitotombe.co.uk'
        COMPANIES_HOUSE_API_KEY: !Sub '{{resolve:ssm:/outreach/companies_house_api_key}}'
        # Additional origins handled in code (corsHeaders function)

Resources:
  ComplianceAuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: lambda/handler.handler
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0'

Outputs:
  AuditFunctionUrl:
    Description: 'Lambda Function URL (no 30s API Gateway timeout)'
    Value: !GetAtt ComplianceAuditFunctionUrl.FunctionUrl
